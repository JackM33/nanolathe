plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.jackm33.nanolathe'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.jackm33.nanolathe'
        minSdk 24
        targetSdk 35
        versionCode 11
        versionName '0.11'
        // tools/android/build.sh binds the engine for 64-bit ARM phones, and
        // for x86_64 emulators when asked (-PnanolatheAbis=x86_64).
        ndk {
            abiFilters(*(project.findProperty('nanolatheAbis') ?: 'arm64-v8a').toString().split(','))
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Personal builds are sideloaded, so the debug key is enough.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // Built by tools/android/build.sh; never committed.
    implementation files('libs/nanolathe.aar')
}
