plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.jackm33.nanolathe'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.jackm33.nanolathe'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1'
        // tools/android/build.sh binds the engine for 64-bit ARM phones only.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Personal builds are sideloaded, so the debug key is enough.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // Built by tools/android/build.sh; never committed.
    implementation files('libs/nanolathe.aar')
}
